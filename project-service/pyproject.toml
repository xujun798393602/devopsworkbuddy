[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "project-service"
version = "0.2.0"
description = "Golden sample project service for the company DevOps platform"
requires-python = ">=3.12,<3.14"
dependencies = [
  "Flask>=3.1,<4",
  "SQLAlchemy>=2.0.41,<2.1",
  "psycopg[binary]>=3.2.9,<4",
  "Alembic>=1.16.4,<2",
  "gunicorn>=23,<24",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "PyYAML>=6.0.2,<7",
  "ruff>=0.12,<1",
  "jsonschema>=4.23,<5",
  "openapi-spec-validator>=0.7.2,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a PostgreSQL database"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
