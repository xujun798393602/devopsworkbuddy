name: wkdevops-rttd

# The seven domain services always target an externally managed PostgreSQL 16
# instance reachable by container name on the pre-existing "wkDEVOPS" bridge
# network. Connection strings carry no in-repository default: an operator must
# inject <DOMAIN>_DATABASE_URL explicitly (DSN carries no password; the
# matching <DOMAIN> password reaches the container through libpq PGPASSWORD
# from a 600-mode operator env-file). Combined with APP_ENV=container this
# turns a missing or misspelled DSN into an immediate start-up failure instead
# of a silent in-memory downgrade that would still report healthy.
networks:
  platform:
    external: true
    name: wkDEVOPS

# Every long-running service declares restart: unless-stopped. Without it the
# default policy is "no", so a host reboot or a Docker daemon restart leaves the
# whole stack down and the portal port unbound (browsers see
# ERR_CONNECTION_REFUSED). "unless-stopped" restores the stack automatically but
# still honours a deliberate `docker compose stop/down` by an operator, which
# "always" would not. The externally managed PostgreSQL already uses the same
# policy. The profile-gated local-infra scaffolding below carries it too: the
# profile keeps the scaffolding from ever starting by accident, but once an
# operator does start it, a database or broker rebuilt from this file must
# inherit the same reboot-survival guarantee rather than silently fall back to
# "no". Tearing the scaffolding down stays a deliberate act
# (`docker compose --profile local-infra down`), which "unless-stopped" honours.
services:
  iam-service:
    build:
      context: ..
      dockerfile: iam-service/Dockerfile
    container_name: wkDEVOPS-iam-service
    restart: unless-stopped
    user: "10001:10001"
    environment:
      APP_ENV: container
      DATABASE_URL: ${IAM_DATABASE_URL}
      # Password is injected out-of-band through libpq PGPASSWORD (600-mode
      # env-file); the DSN above deliberately carries no secret.
      PGPASSWORD: ${PGPASSWORD_IAM}
      # No external identity provider exists yet, so the integration profile
      # still authenticates through the local development provider. IAM only
      # accepts that downgrade when it is stated here explicitly, exactly as
      # tp-service must state ALLOW_EXPLICIT_MOCK_CAPABILITY for its mock AI.
      ALLOW_EXPLICIT_DEV_AUTH: "true"
    ports: ["127.0.0.1:${IAM_PORT:-18140}:18140"]
    networks: [platform]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18140/ready', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 5
    read_only: true
    tmpfs: [/tmp:size=64m]
    security_opt: [no-new-privileges:true]
  workflow-service:
    build:
      context: ..
      dockerfile: workflow-service/Dockerfile
    container_name: wkDEVOPS-workflow-service
    restart: unless-stopped
    user: "10001:10001"
    environment:
      APP_ENV: container
      DATABASE_URL: ${WORKFLOW_DATABASE_URL}
      PGPASSWORD: ${PGPASSWORD_WORKFLOW}
    ports: ["127.0.0.1:${WORKFLOW_PORT:-18150}:18150"]
    networks: [platform]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18150/ready', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 5
    read_only: true
    tmpfs: [/tmp:size=64m]
    security_opt: [no-new-privileges:true]
  requirement-service:
    build:
      context: ..
      dockerfile: requirement-service/Dockerfile
    container_name: wkDEVOPS-requirement-service
    restart: unless-stopped
    user: "10001:10001"
    environment:
      APP_ENV: container
      DATABASE_URL: ${REQUIREMENT_DATABASE_URL}
      PGPASSWORD: ${PGPASSWORD_REQUIREMENT}
    ports: ["127.0.0.1:${REQUIREMENT_PORT:-18110}:18110"]
    networks: [platform]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18110/ready', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 5
    read_only: true
    tmpfs: [/tmp:size=64m]
    security_opt: [no-new-privileges:true]
  tp-service:
    build:
      context: ..
      dockerfile: tp-service/Dockerfile
    container_name: wkDEVOPS-tp-service
    restart: unless-stopped
    user: "10001:10001"
    environment:
      APP_ENV: container
      DATABASE_URL: ${TP_DATABASE_URL}
      PGPASSWORD: ${PGPASSWORD_TP}
      AI_ADAPTER: mock
      ALLOW_EXPLICIT_MOCK_CAPABILITY: "true"
    ports: ["127.0.0.1:${TP_PORT:-18120}:18120"]
    networks: [platform]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18120/ready', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 5
    read_only: true
    tmpfs: [/tmp:size=256m]
    security_opt: [no-new-privileges:true]
  td-service:
    build:
      context: ..
      dockerfile: td-service/Dockerfile
    container_name: wkDEVOPS-td-service
    restart: unless-stopped
    user: "10001:10001"
    environment:
      APP_ENV: container
      DATABASE_URL: ${TD_DATABASE_URL}
      PGPASSWORD: ${PGPASSWORD_TD}
      FIX_EVIDENCE_ADAPTER: placeholder
    ports: ["127.0.0.1:${TD_PORT:-18130}:18130"]
    networks: [platform]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18130/ready', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 5
    read_only: true
    tmpfs: [/tmp:size=64m]
    security_opt: [no-new-privileges:true]
  audit-service:
    build:
      context: ..
      dockerfile: audit-service/Dockerfile
    container_name: wkDEVOPS-audit-service
    restart: unless-stopped
    user: "10001:10001"
    environment:
      APP_ENV: container
      DATABASE_URL: ${AUDIT_DATABASE_URL}
      PGPASSWORD: ${PGPASSWORD_AUDIT}
    ports: ["127.0.0.1:${AUDIT_PORT:-18160}:18160"]
    networks: [platform]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18160/ready', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 5
    read_only: true
    tmpfs: [/tmp:size=64m]
    security_opt: [no-new-privileges:true]
  notification-service:
    build:
      context: ..
      dockerfile: notification-service/Dockerfile
    container_name: wkDEVOPS-notification-service
    restart: unless-stopped
    user: "10001:10001"
    environment:
      APP_ENV: container
      DATABASE_URL: ${NOTIFICATION_DATABASE_URL}
      PGPASSWORD: ${PGPASSWORD_NOTIFICATION}
    ports: ["127.0.0.1:${NOTIFICATION_PORT:-18170}:18170"]
    networks: [platform]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18170/ready', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 5
    read_only: true
    tmpfs: [/tmp:size=64m]
    security_opt: [no-new-privileges:true]
  # Project domain microservice (projects/tasks/collaboration). The image is a
  # pre-built immutable release artifact: pull_policy: never guarantees the
  # remote never rebuilds from source (remote only receives controlled,
  # immutable releases). DATABASE_URL carries no password; the matching
  # password reaches the container through libpq PGPASSWORD from the 600-mode
  # operator env-file, exactly like the seven domain services.
  project-service:
    image: wkdevops-rttd-project-service:latest
    pull_policy: never
    container_name: wkDEVOPS-project-service
    restart: unless-stopped
    user: "10001:10001"
    environment:
      APP_ENV: container
      SERVICE_NAME: project-service
      ALLOWED_ORIGINS: ${PROJECT_ALLOWED_ORIGINS:-http://localhost:5173}
      DATABASE_URL: ${PROJECT_DATABASE_URL}
      PGPASSWORD: ${PGPASSWORD_PROJECT}
      INTERNAL_SERVICE_TOKEN: ${PROJECT_INTERNAL_SERVICE_TOKEN}
    ports: ["127.0.0.1:${PROJECT_PORT:-18190}:8080"]
    networks: [platform]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 5
    read_only: true
    tmpfs: [/tmp:size=64m]
    security_opt: [no-new-privileges:true]
  # Browser BFF: cookie-only same-site gateway. It resolves identity through
  # IAM on every request and proxies domain traffic with verified actor
  # headers. The portal nginx.conf proxies /bff/ to the DNS alias "gateway".
  # Dev-mode posture (APP_ENV=development + COOKIE_SECURE=false) is required so
  # browsers can complete login over plain http on the LAN. This downgrade is
  # isolated to the stateless gateway ONLY; the seven domain services and
  # project-service keep APP_ENV=container (their DB fail-closed gate). CSRF
  # enforcement is unchanged: Origin whitelist + double-submit token still gate
  # every state-changing /bff/ request.
  gateway:
    image: wkdevops-rttd-gateway:latest
    pull_policy: never
    container_name: wkDEVOPS-devops-api-gateway
    restart: unless-stopped
    user: "10001:10001"
    environment:
      APP_ENV: development
      COOKIE_SECURE: "false"
      TRUSTED_ORIGINS: "http://192.168.3.177:18081,http://localhost:5173"
      IAM_URL: http://wkDEVOPS-iam-service:18140
      PROJECT_URL: http://wkDEVOPS-project-service:8080
      REQUIREMENT_URL: http://wkDEVOPS-requirement-service:18110
      TP_URL: http://wkDEVOPS-tp-service:18120
      TD_URL: http://wkDEVOPS-td-service:18130
      WORKFLOW_URL: http://wkDEVOPS-workflow-service:18150
      AUDIT_URL: http://wkDEVOPS-audit-service:18160
      NOTIFICATION_URL: http://wkDEVOPS-notification-service:18170
    ports: ["127.0.0.1:${GATEWAY_PORT:-18180}:18180"]
    networks:
      platform:
        aliases: [gateway]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18180/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 5
    read_only: true
    tmpfs: [/tmp:size=64m]
    security_opt: [no-new-privileges:true]
  # Static portal: nginx serves the built Vue SPA and proxies /bff/ to the
  # gateway. Exposed on 0.0.0.0 so browsers on the LAN can reach the portal.
  # The image runs as the nginx user (not 10001) so no user override is set.
  portal:
    image: wkdevops-rttd-portal:latest
    pull_policy: never
    container_name: wkDEVOPS-devops-portal
    restart: unless-stopped
    environment:
      APP_ENV: container
    ports: ["0.0.0.0:${PORTAL_PORT:-18081}:8080"]
    networks: [platform]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
    read_only: true
    # nginx (uid 101) must be able to create temp dirs under /var/cache/nginx
    # and its pid file under /run. Docker tmpfs inherits the mountpoint mode
    # from the image (0755 root-owned), so mode=1777 must be explicit; /run is
    # mounted instead of /var/run because /var/run is a symlink to /run.
    tmpfs:
      - /var/cache/nginx:size=16m,mode=1777
      - /run:size=16m,mode=1777
      - /tmp:size=16m
    security_opt: [no-new-privileges:true]
  # Throwaway scaffolding for isolated local experiments only. Profile-gated so
  # that a plain `docker compose up` can neither bind a port owned by the
  # platform instance nor start a database engine of a different major version.
  postgres:
    profiles: ["local-infra"]
    image: postgres:16-alpine
    container_name: wkDEVOPS-python-compat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-25532}:5432"
    networks: [platform]
    volumes:
      - ./postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
  rabbitmq:
    profiles: ["local-infra"]
    image: rabbitmq:4.1-management-alpine
    container_name: wkDEVOPS-python-compat-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: wkdevops
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: -rabbitmq_management load_definitions "/etc/rabbitmq/definitions.json"
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-25672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-25673}:15672"
    networks: [platform]
    volumes:
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes: {}
