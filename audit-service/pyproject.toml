[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name="audit-service"
version="0.1.0"
requires-python=">=3.12,<3.14"
dependencies=["Flask>=3.1,<4","SQLAlchemy>=2.0.41,<2.1","Alembic>=1.16.4,<2","psycopg[binary]>=3.2.9,<4","gunicorn>=23,<24"]
[project.optional-dependencies]
dev=["pytest>=8.4,<9","ruff>=0.12,<1"]
[tool.pytest.ini_options]
pythonpath=["src"]
[tool.ruff]
target-version="py312"
line-length=100
