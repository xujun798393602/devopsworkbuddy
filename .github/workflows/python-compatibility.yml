name: Python compatibility
on:
  pull_request:
  push:
    branches: [main]
jobs:
  source-and-contract-gates:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Record runtime metadata
        run: |
          python --version
          python -c "import sys,sysconfig; print(sys.implementation.cache_tag); print(sysconfig.get_platform())"
          python -m pip debug --verbose
      - name: Install locked test tools
        run: python -m pip install -r constraints/${{ startsWith(matrix.python, '3.12') && 'cp312' || 'cp313' }}-linux-x86_64.txt
      - name: Run aggregate compatibility gate
        shell: pwsh
        run: ./scripts/run-python-matrix.ps1 -Python python -Label py${{ startsWith(matrix.python, '3.12') && '312' || '313' }}
